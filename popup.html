<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Focus Clock Settings</title>
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg?v=2">
    <link rel="icon" type="image/png" href="icons/icon32.png?v=2">
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main class="popup">
      <header>
        <span class="logo-mark">WHA</span>
        <h1>New Tab</h1>
      </header>

      <section aria-label="Mode">
        <div class="section-label">Mode</div>
        <div class="segmented" role="group" aria-label="Mode">
          <button type="button" data-mode="dark">Dark</button>
          <button type="button" data-mode="light">Light</button>
        </div>
      </section>

      <label class="field">
        <span>Name</span>
        <input id="nameInput" type="text" maxlength="28" autocomplete="off" spellcheck="false">
      </label>

      <label class="toggle">
        <span>24-hour time</span>
        <input id="hour24Input" type="checkbox">
      </label>

      <label class="toggle">
        <span>Show seconds</span>
        <input id="showSecondsInput" type="checkbox">
      </label>
    </main>
  </body>
</html>
